name: Build

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_binary:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ macos-latest, ubuntu-latest, windows-latest ]
        # Specific version: MSVR of the CLI binary
        rust: [ 1.85.0, stable, nightly ]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.runs-on }}-${{ matrix.rust }}"
      - name: cargo check (debug)
        run: cargo check --all-targets --features bin
      - name: cargo check (release)
        run: cargo check --all-targets --features bin --release
      - name: cargo build (debug)
        run: cargo build --all-targets --features bin
      - name: cargo build (release)
        run: cargo build --all-targets --features bin --release
      - name: cargo test
        run: cargo test
      # Test that we don't segfault or so because of the LTO.
      - name: "CLI [release]: ttfb --help"
        run: cargo run --release --features bin -- --help
      - name: "CLI [release]: ttfb github.com"
        run: cargo run --release --features bin -- github.com

  # The lib is already transitively build above. Here, we only verify the MSRV.
  # The rust toolchain comes from `rust-toolchain.toml`.
  build_library_msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Lib as Dependency with MSRV
        run: cd ttfb-lib-msrv-check && cargo check --all-targets

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --all-targets

  # Each protocol has a Cargo feature. Without it, the code paths that report
  # the protocol as unsupported are built instead.
  feature_combinations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - --no-default-features
          - --no-default-features --features http2
          - --no-default-features --features http3
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo clippy --all-targets ${{ matrix.features }}
      - run: cargo test --all-targets ${{ matrix.features }}

  network_tests:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg network_tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo build --tests
      # An unreachable host blocks a test for minutes, until the TCP connect
      # times out. Fail early instead.
      - name: Run tests
        timeout-minutes: 2
        run: cargo test -- network_tests

  # Checks the format of the JSON output, as scripts depend on it.
  json_output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features bin
      - name: Check the JSON output
        timeout-minutes: 2
        run: ./check-json-output.sh

  # Runs the CLI with combinations of its options.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features bin
      - name: Check the CLI
        timeout-minutes: 5
        run: ./check-cli.sh

  style_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets
      - run: cargo doc --document-private-items --no-deps
