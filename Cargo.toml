[package]
name = "ttfb"
description = """
Library + CLI utility to measure the TTFB (time to first byte) of HTTP(S)
requests. This includes data of intermediate steps, such as the relative and
absolute timings of DNS lookup, TCP connect, and TLS handshake.
"""
version = "2.0.0"
edition = "2024"
rust-version = "1.85" # MSRV of the library (= min(lib,bin))
keywords = ["ttfb", "http", "timings", "web"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/phip1611/ttfb"
repository = "https://github.com/phip1611/ttfb"
documentation = "https://docs.rs/ttfb"
authors = [
  "Philipp Schuster <phip1611@gmail.com>"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

[[bin]]
name = "ttfb"
required-features = ["bin"]

# Feature for all additional dependencies of the binary.
[features]
default = ["http2", "http3"]
bin = ["dep:clap", "dep:crossterm"]
# HTTP/2 measurements with h2 over tokio-rustls.
http2 = ["dep:h2", "dep:http", "dep:tokio-rustls", "tokio/net"]
# HTTP/3 measurements with h3 over quinn.
http3 = ["dep:h3", "dep:h3-quinn", "dep:http", "dep:quinn", "tokio/time"]

[dependencies]
# +++ LIBRARY +++

# HTTP/1.1 response framing
httparse = "1.10.1"

# HTTP/2 (feature "http2")
h2 = { version = "0.4.11", optional = true }
# HTTP types (features "http2" and "http3")
http = { version = "1.3.1", optional = true }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["ring"] }

# HTTP/3 (feature "http3")
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.7", optional = true, default-features = false, features = ["ring", "runtime-tokio", "rustls"] }

thiserror = "2.0.12"
# DNS over systems default DNS resolver
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["system-config", "tokio"] }
# TLS handshake
rustls = { version = "0.23.25", default-features = false, features = ["tls12", "logging", "ring", "std"] }
# Root certificates: the system's and the bundled Mozilla ones
rustls-native-certs = "0.8.1"
webpki-roots = "1.0.2"
# nice abstraction of URL
url = "2.5.4"

# +++ BINARY +++
# used for the binary, not the lib
[dependencies.crossterm]
optional = true
version = "0.29.0"

# CLI args parsing
[dependencies.clap]
optional = true
version = "~4.6.1"
features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "unicode",
  "usage",
  "wrap_help",
]

[dependencies.tokio]
version = "1.50.0"
default-features = false
features = [
  "rt",
]

[lints.rust]
# level is probably irrelevant
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(network_tests)'] }
